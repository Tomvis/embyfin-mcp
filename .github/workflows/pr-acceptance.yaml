---
name: tests
on:
  push:
    branches: [ 'main' ]
  pull_request:
    types: ['opened', 'synchronize']
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'vendor/**'
      - 'makefile'
      - '.scripts/testenv.sh'
      - 'acceptance/**'
      # sdk's tests re-import the specs and regenerate the SDKs,
      # failing when api-defs/, sdk/emby or sdk/jf are stale
      - 'api-defs/**'
      - '.github/workflows/pr-acceptance.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # the unit tests need no server: the tools against a canned one, and the
  # parsers, scoring and SDK generation on their own
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./.go-version
      - run: make test

  # one job per suite and backend, so a failure names which layer broke and
  # on which server: the client's view of the API, or the tools' behaviour
  # on top of it
  sdk:
    name: acceptance (the ${{ matrix.backend }} SDK against a real server)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        backend: [emby, jellyfin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./.go-version

      # ffmpeg generates the fixture videos, jq parses the setup responses
      # and openssl mints the provider proxy's CA. ffmpeg is not on the
      # runner image, so install it rather than assume it is there.
      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg jq openssl docker

      # make owns the container lifecycle, so CI runs exactly what a
      # developer runs rather than a second copy of the same steps. Provider
      # calls replay from the committed cassettes, so this needs no network
      # beyond the container image.
      - name: Run the SDK suite
        run: make testacc-sdk-${{ matrix.backend }}

      - name: Tear down
        if: always()
        run: |
          EMBYFIN_TEST_BACKEND=${{ matrix.backend }} EMBYFIN_TEST_CONTAINER=embyfin-mcp-sdk-${{ matrix.backend }} \
            EMBYFIN_TEST_DATA="$HOME/.cache/embyfin-mcp/testenv/sdk-${{ matrix.backend }}" \
            .scripts/testenv.sh down || true

  embyfin:
    name: acceptance (sdk/embyfin against a real ${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        backend: [emby, jellyfin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./.go-version

      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg jq openssl docker

      - name: Run the sdk/embyfin suite
        run: make testacc-embyfin-${{ matrix.backend }}

      - name: Tear down
        if: always()
        run: |
          EMBYFIN_TEST_BACKEND=${{ matrix.backend }} EMBYFIN_TEST_CONTAINER=embyfin-mcp-embyfin-${{ matrix.backend }} \
            EMBYFIN_TEST_DATA="$HOME/.cache/embyfin-mcp/testenv/embyfin-${{ matrix.backend }}" \
            .scripts/testenv.sh down || true

  tools:
    name: acceptance (the tools against a real ${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [emby, jellyfin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./.go-version

      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg jq openssl docker

      - name: Run the tool suite
        run: make testacc-tools-${{ matrix.backend }}

      - name: Tear down
        if: always()
        run: |
          EMBYFIN_TEST_BACKEND=${{ matrix.backend }} EMBYFIN_TEST_CONTAINER=embyfin-mcp-tools-${{ matrix.backend }} \
            EMBYFIN_TEST_DATA="$HOME/.cache/embyfin-mcp/testenv/tools-${{ matrix.backend }}" \
            .scripts/testenv.sh down || true
          # and the second, empty server the suite runs beside its own, of the other kind
          for b in emby jellyfin; do
            EMBYFIN_TEST_BACKEND=$b .scripts/testenv.sh beside-down || true
          done
